- name: Setup Vprofile Bastion Host
  hosts: localhost
  connection: local
  gather_facts: False
  tasks:
    - name: Import VPC setup Variable
      include_vars: vars/vpc_setup
    
    - name: Import VPC setup Variable
      include_vars: vars/output_vars

    - name: Create vprofile ec2 key
      amazon.aws.ec2_key:
        name: vprofile-key
        region: "{{ region }}"
      register: key_out

    - name: Save private key in file bastion-key.pem
      copy:
        content: "{{ key_out.key.private_key }}"
        dest: "./bastion-key.pem"
        mode: '0600'
      when: key_out.changed
    
    - name: create security group for bastion host
      amazon.aws.ec2_security_group: 
        name: vprofile-bastion-host-sg
        description: Security Group for Vprofile Bastion Host
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ MYIP }}"
      register: bastion_sg_out

    - name: Launch Bastion Host Instance
      amazon.aws.ec2_instance:
        name : vprofile-bastion-host
        key_name: vprofile-key
        instance_type: t2.micro
        image_id: "{{ bastion_ami }}"
        security_groups: "{{ bastion_sg_out.group_id }}"
        region: "{{ region }}"
        vpc_subnet_id: "{{ pubsub1id }}"
        exact_count: 1
        wait: yes
        wait_timeout: 200
        tags:
          Name: vprofile-bastion-host
          project: vprofile
          Owner: devops-team
      register: bastion_instance_out    