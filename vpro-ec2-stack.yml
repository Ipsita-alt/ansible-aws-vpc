- name: setup Vprofile setup
  hosts: localhost
  connection: local
  gather_facts: False
  tasks:
    - name: Import VPC Variables
      include_vars: vars/vars-output_vars
    
    - name: Import Vprofile Stack Variables
      include_vars: vars/vprostacksetup

    - name: Create vprofile ec2 key for vprofile stack
      amazon.aws.ec2_key:
        name: vprokey
        region: "{{ region }}"
      register: vprokey_out

    - name: Save private key in file loginkey_vpro.pem
      copy:
        content: "{{ vprokey_out.key.private_key }}"
        dest: "./loginkey_vpro.pem"
        mode: '0600'
      when: vprokey_out.changed

    - name: create security group for load balancer
      amazon.aws.ec2_security_group: 
        name: vproELB-sg
        description: Allow port 80 from anywhereand all the port within sg
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: vproELBSG_out

    - name: Create Security Group for Vprofile Stack
      amazon.aws.ec2_security_group:
        name: vproStack-sg
        description: Allow port 22 from Bastion and allow port 80 within SG
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            group_id: "{{ vproELBSG_out.group_id }}"

          - proto: tcp
            from_port: 22
            to_port: 22
            group_id: "{{ BastionSGid }}"
      register: vproStackSG_out


    - name: Update with Security Groups its own sg id
      amazon.aws.ec2_security_group:
        name: vproStack-sg
        description: Allow port 22 from Bastion and allow port 80 within SG
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: all
            group_id: "{{ vproStackSG_out.group_id }}"


