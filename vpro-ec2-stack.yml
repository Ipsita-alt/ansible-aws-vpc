- name: setup Vprofile setup
  hosts: localhost
  connection: local
  gather_facts: False
  tasks:
    - name: Import VPC Variables
      include_vars: vars/vars-output_vars
    
    - name: Import Vprofile Stack Variables
      include_vars: vars/vprostacksetup

    - name: Create vprofile ec2 key for vprofile stack
      ec2_key:
        name: vprokey
        region: "{{ region }}"
      register: vprokey_out

    - name: Save private key in file loginkey_vpro.pem
      copy:
        content: "{{ vprokey_out.key.private_key }}"
        dest: "./loginkey_vpro.pem"
        mode: '0600'
      when: vprokey_out.changed

    - name: create security group for load balancer
      amazon.aws.ec2_security_group: 
        name: vproELB-sg
        description: Allow port 80 from anywhereand all the port within sg
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: vproELBSG_out

    - name: Create Security Group for Vprofile Stack
      amazon.aws.ec2_security_group:
        name: vproStack-sg
        description: Allow port 22 from Bastion and allow port 80 within SG
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            group_id: "{{ vproELBSG_out.group_id }}"

          - proto: tcp
            from_port: 22
            to_port: 22
            group_id: "{{ BastionSGid }}"
      register: vproStackSG_out


    - name: Update with Security Groups its own sg id
      amazon.aws.ec2_security_group:
        name: vproStack-sg
        description: Allow port 22 from Bastion and allow port 80 within SG
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: all
            group_id: "{{ vproStackSG_out.group_id }}"

    - name: Creating Nginx web01
      amazon.aws.ec2_instance:
        name: "web01"
        key_name: vprokey
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ nginx_ami }}"
        wait: yes
        wait_timeout: 300
        network:
          vpc_subnet_id: "{{ privsub1id }}"
          security_group_id: "{{ vproStackSG_out.group_id }}"
        tags:
          Name: "web01"
          Project: "Vprofile"
          Owner: "DevOps Team"
      register: web01_out

    - name: Creating Tomcat app01
      amazon.aws.ec2_instance:
        name: "app01"
        key_name: vprokey
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ tomcat_ami }}"
        wait: yes
        wait_timeout: 300
        network:
          vpc_subnet_id: "{{ privsub1id }}"
          security_group_id: "{{ vproStackSG_out.group_id }}"
        tags:
          Name: "app01"
          Project: "Vprofile"
          Owner: "DevOps Team"
      register: app01_out

    - name: Creating Memcache mc01
      amazon.aws.ec2_instance:
        name: "mc01"
        key_name: vprokey
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ memcache_ami }}"
        wait: yes
        wait_timeout: 300

        network:
          vpc_subnet_id: "{{ privsub1id }}"
          security_group_id: "{{ vproStackSG_out.group_id }}"

        tags:
          Name: "mc01"
          Project: "Vprofile"
          Owner: "DevOps Team"
      register: mc01_out

    - name: Creating RabbitMQ rmq01
      amazon.aws.ec2_instance:
        name: "rmq01"
        key_name: vprokey
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ rmq_ami }}"
        wait: yes
        wait_timeout: 300

        network:
          vpc_subnet_id: "{{ privsub1id }}"
          security_group_id: "{{ vproStackSG_out.group_id }}"

        tags:
          Name: "rmq01"
          Project: "Vprofile"
          Owner: "DevOps Team"

      register: rmq01_out


    - name: Creating Mysql db01
      amazon.aws.ec2_instance:
        name: "db01"
        key_name: vprokey
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ mysql_ami }}"
        wait: yes
        wait_timeout: 300

        network:
          vpc_subnet_id: "{{ privsub1id }}"
          security_group_id: "{{ vproStackSG_out.group_id }}"

        tags:
          Name: "db01"
          Project: "Vprofile"
          Owner: "DevOps Team"

      register: db01_out

    - debug:
        var: db01_out



      
          



